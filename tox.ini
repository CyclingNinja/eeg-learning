[tox]
requires =
    tox>=4.22
    tox-uv>=1.13
env_list =
    py312,
    py313,
    lint
# py313 + braindecode 1.6 is the supported stack after the TUAB v3.0.1 / braindecode
# migration. braindecode 1.6 requires Python >=3.11, so the old py39 env was retired.
skip_missing_interpreters = true

[testenv]
description = run the eeg_learning test suite
# uv-venv-runner builds the env with uv (fast, shared cache) resolving from
# pyproject.toml. We avoid the lock runner because uv.lock is gitignored, so
# `uv sync --locked` is not portable to a fresh clone / CI.
runner = uv-venv-runner
dependency_groups = dev
commands =
    pytest \
    -vvv \
    -r fEs \
    --pyargs eeg_learning \
    --cov-report=xml \
    --cov=eeg_learning \
    --cov-config={toxinidir}/.coveragerc \
    {posargs}

[testenv:lint]
description = ruff lint + format checks
runner = uv-venv-runner
# lint only needs ruff, so skip installing the project and its heavy deps.
skip_install = true
dependency_groups =
deps = ruff>=0.15.14
commands =
    ruff check {posargs:eeg_learning}
    ruff format --check {posargs:eeg_learning}
