[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-learning"
version = "0.1.0"
description = "EEG experimentation and arbitration project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.4,<2.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "torchaudio>=2.2",
  "mne>=1.11,<2.0",
  "braindecode>=1.6,<2.0",
  "einops>=0.7,<1.0",
  "bayesian-optimization>=1.4.3,<2.0",
  "skorch>=1.3,<2.0",
  "matplotlib>=3.8,<4.0",
  "xgboost>=2.0,<4.0",
  "Pillow>=10.0,<12.0",
  "mlflow>=3.0",
]

[project.scripts]
eeg-learning = "eeg_learning.cli:main"

[tool.setuptools]
py-modules = [
  "final_decision",
  "train_and_eval",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eeg_learning*"]

# params.toml is loaded at runtime via Path(__file__).parent, so it must ship
# inside the wheel/sdist — otherwise load() breaks for any installed consumer
# (DVC pipeline, API, remote backends), even though it works from the source tree.
[tool.setuptools.package-data]
"eeg_learning.config" = ["params.toml"]

# Resolve torch from the CPU wheel index. The test/tox env runs on CPU, and the
# default CUDA wheels pull conflicting nvidia-nccl-cu12/-cu13 packages that fail
# to import (`undefined symbol: ncclCommResume`). GPU training environments can
# override these sources or install a CUDA build separately.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
filterwarnings = [
  # braindecode 1.x transitively imports local-attention / colt5-attention,
  # which call torch.cuda.amp.autocast (deprecated in torch 2.x).
  "ignore:.*torch.cuda.amp.autocast.*:FutureWarning",
  # mne 1.11 sets ndarray.shape in-place; deprecated under numpy 2.5.
  "ignore:.*Setting the shape on a NumPy array.*:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.14",
    "dvc>=3.0,<4.0",
    "dvc-azure>=3.0,<4.0",
    "tox>=4.22",
    "tox-uv>=1.13",
]
