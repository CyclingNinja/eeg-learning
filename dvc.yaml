stages:
  preprocess:
    cmd: uv run python -m eeg_learning.pipeline.preprocess
    params:
      - eeg_win_stack/config/params.toml:
          - data
          - preprocessing
          - windowing
          - run
    outs:
      - target/saved_windows:
          cache: true

  train:
    cmd: uv run python -m eeg_learning.pipeline.train
    deps:
      - ./target/saved_windows
    params:
      - eeg_win_stack/config/params.toml:
          - split
          - training
          - model
          - run
    outs:
      - target/saved_models/window_model:
          cache: true

  evaluate:
    cmd: uv run python -m eeg_learning.pipeline.evaluate
    deps:
      - .\target\saved_windows
      - target/saved_models/window_model
    params:
      - eeg_win_stack/config/params.toml:
          - output.training_detail_path
          - output.saved_models_path
          - split
          - model
          - run
    metrics:
      - metrics.json:
          cache: false
    outs:
      - target/training_detail:
          cache: false
  
  decision:
    cmd: uv run python -m eeg_learning.pipeline.decision
    deps:
      - target/training_detail
      # Holds the run token this stage reads to rejoin the train stage's MLflow run.
      - target/saved_models/window_model
    params:
      - eeg_win_stack/config/params.toml:
          - decision
          - output.decision_models_path
          - output.saved_models_path
          - run
    # target/decision_results.csv is deliberately NOT an out. The per-repetition
    # rows are a results table, and those live in MLflow as nested child runs
    # (one per repetition) where they can be compared across runs. Declaring it
    # here would also pin the filename, which blocks per-run naming. The stage
    # still writes the CSV to disk as a local fallback for when tracking is off.
    outs:
      - target/saved_models/decision_model:
          cache: true
    metrics:
      - target/decision_metrics.json:
          cache: false
